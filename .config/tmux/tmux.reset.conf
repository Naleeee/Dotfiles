# General settings
bind R source-file ~/.config/tmux/tmux.conf
bind : command-prompt
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

# Session mappings
bind S choose-session
bind T run-shell "sesh connect \"$(\
  sesh list --icons | fzf-tmux -p 80%,70% --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d kill' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' --preview 'sesh preview {}' \
)\""

# Windows mappings
bind ^C new-window -c "$HOME"
bind r command-prompt "rename-window %%"
bind H previous-window
bind L next-window
bind '"' choose-window

# Panes mappings
bind x resize-pane -Z
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind * setw synchronize-panes # Edit every panes at once
bind P set pane-border-status
bind c kill-pane

# Workmux mappings
bind C-s display-popup -h 80% -w 90% -E "workmux dashboard"
