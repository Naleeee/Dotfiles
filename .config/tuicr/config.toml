theme = "catppuccin-mocha"
diff_view = "side-by-side"   # or "unified"
ignore_whitespace = false    # ignore all whitespace in local VCS diffs
appearance = "system"        # or "dark" / "light"
mouse = true
leader = ";"                  # configurable prefix for leader shortcuts
comment_vim = false           # vim modal editing in the review comment box
review_watch_interval_ms = 1000 # set to 0 to disable persisted-review polling

comment_types = [
  { id = "note",       label = "question",   definition = "ask for clarification",  color = "#FDE68A" },
  { id = "suggestion", label = "suggestion", definition = "possible improvements",  color = "#C4B5FD" },
  { id = "issue",      label = "issue",      definition = "problems to fix",        color = "#FCA5A5" },
  { id = "praise",     label = "praise",     definition = "positive feedback",      color = "#86EFAC" },
]

[forge]
comment_type_prefix = false
