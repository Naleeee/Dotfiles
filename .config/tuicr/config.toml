theme = "catppuccin-mocha"
diff_view = "side-by-side"
comment_vim = true
scroll_offset = 10

comment_types = [
  { id = "question",   label = "question",   definition = "ask for clarification",  color = "#F9E2AF" },
  { id = "suggestion", label = "suggestion", definition = "possible improvements",  color = "#CBA6F7" },
  { id = "issue",      label = "issue",      definition = "problems to fix",        color = "#F38BA8" },
  { id = "praise",     label = "praise",     definition = "positive feedback",      color = "#A6E3A1" },
]

[forge]
comment_type_prefix = false
