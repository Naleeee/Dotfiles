source-file ~/.config/tmux/tmux.reset.conf
# set-option -g default-terminal 'screen-256color'
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-kitty:RGB"
# set-option -g terminal-overrides ',xterm-256color:RGB'

set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 50000       # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g pane-active-border-style 'fg=#cba6f7,bg=default'
set -g pane-border-style 'fg=#313244,bg=default'
set -g mouse on
set -g pane-border-status "top"

# Plugins list

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
# set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/catppuccin-tmux'
set -g @plugin 'alberti42/tmux-fzf-links'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'omerxx/tmux-sessionx'

# Plugins options

# Fzf links config
set-option -g @fzf-links-key 'u'
set-option -g @fzf-links-browser-open-cmd "open -a Zen '%url'" # Open URLs in Zen Browser
set-option -g @fzf-links-editor-open-cmd "tmux new-window -n 'edit' nvim +%line '%file'" # Configure command to open files
set-option -g @fzf-links-fzf-display-options "-w 60% -h 40% --maxnum-displayed 20 --multi --track --no-preview" # Customize fzf appearance
set-option -g @fzf-links-use-colors on # Enable colors in fzf-links popup
set-option -g @fzf-links-ls-colors-filename "~/.cache/tmux-fzf-links/cached_ls_colors.txt" # Catppuccin Mocha LS_COLORS for file/dir coloring
set-option -g popup-border-lines rounded
set-option -g popup-style "bg=#1e1e2e,fg=#cdd6f4"
set-option -g popup-border-style "fg=#cba6f7,bg=#1e1e2e"

# Claude Code state badges, written by ~/.config/tmux/claude-state.sh from Claude hooks
%hidden claude_badge="#{?@claude_state,#{?#{==:#{@claude_state},waiting},#[fg=#eba0ac] 󰂞,#[fg=#74c7ec] },}"
%hidden claude_pill_color="#{?#{==:#{@claude_state},waiting},#eba0ac,#74c7ec}"
%hidden claude_on_screen="#{&&:#{==:#{session_name},#{client_session}},#{window_active}}"
set -g @claude_pills "#{S:#{W:#{?#{&&:#{@claude_state},#{!:${claude_on_screen}}},#[range=user|#{window_id}]#[fg=${claude_pill_color}]#[bg=#1e1e2e] #[fg=#1e1e2e]#[bg=${claude_pill_color}]#W #[fg=#cdd6f4]#[bg=#313244] #S#[fg=#313244]#[bg=#1e1e2e] #[norange],}}}"
set-hook -g pane-focus-in 'set -wqu @claude_state'
set-hook -g after-select-window 'set -wqu @claude_state'
bind -T root MouseDown1Status if -F '#{m:@*,#{mouse_status_range}}' 'run-shell "tmux switch-client -t #{mouse_status_range}"' 'switch-client -t ='

# Catppuccin config
set -g @catppuccin_flavour 'mocha' # latte, frappe, macchiato, mocha
set -g @catppuccin_window_left_separator " "
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W${claude_badge}"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}${claude_badge}"
set -g @catppuccin_status_modules_right "directory"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_date_time_text "%H:%M"

# Floax config
set -g @floax-bind '-n M-p' # "Win + p"
set -g @floax-width '90%'
set -g @floax-height '90%'

# Sessionx config
set -g @sessionx-bind 'O'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-git-branch 'on'
set -g @sessionx-window-width '80%'
set -g @sessionx-window-height '70%'
set -g @sessionx-preview-ratio '55%'
set -g @sessionx-prompt '⚡  '

# Resurrect config
# set -g @resurrect-strategy-nvim 'session'
# set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'

# After tpm: catppuccin rebuilds status-right and caps it at 100, pills go in front of the directory pill
run-shell 'tmux set -g status-right "$(tmux show -gv @claude_pills)$(tmux show -gv status-right)"'
set -g status-right-length 150
