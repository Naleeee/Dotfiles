"$schema" = 'https://starship.rs/config-schema.json'

palette = 'catppuccin_mocha'
add_newline = false

format = """
[╭─](overlay0)\
[](surface0)\
$os\
$directory\
$git_branch\
$git_status\
[](fg:surface0)\
$line_break\
[╰─](overlay0) """

right_format = """
$status\
$cmd_duration\
$jobs\
$nodejs\
$python\
$time"""

[os]
disabled = false
style = 'bg:surface0 fg:text'
format = '[$symbol]($style)'

[os.symbols]
Macos = ' '
Arch = ' '
Linux = ' '

[directory]
style = 'bg:surface0 fg:blue'
format = '[ $path ]($style)'
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = ' '
style = 'bg:surface0 fg:green'
format = '[$symbol$branch(:$remote_branch)]($style)'

[git_status]
style = 'bg:surface0 fg:yellow'
format = '[( $all_status$ahead_behind) ]($style)'

[status]
disabled = false
symbol = '[✘](red)'
format = '[$symbol $int]($style) '

[cmd_duration]
min_time = 3000
style = 'yellow'
format = '[ $duration]($style) '

[jobs]
style = 'teal'
format = '[$symbol$number]($style) '

[nodejs]
style = 'green'
format = '[$symbol($version )]($style)'

[python]
style = 'yellow'
format = '[$symbol($version )(\($virtualenv\) )]($style)'

[time]
disabled = false
time_format = '%H:%M:%S'
style = 'subtext1'
format = '[$time]($style)'

[palettes.catppuccin_mocha]
rosewater = '#f5e0dc'
flamingo = '#f2cdcd'
pink = '#f5c2e7'
mauve = '#cba6f7'
red = '#f38ba8'
maroon = '#eba0ac'
peach = '#fab387'
yellow = '#f9e2af'
green = '#a6e3a1'
teal = '#94e2d5'
sky = '#89dceb'
sapphire = '#74c7ec'
blue = '#89b4fa'
lavender = '#b4befe'
text = '#cdd6f4'
subtext1 = '#bac2de'
subtext0 = '#a6adc8'
overlay2 = '#9399b2'
overlay1 = '#7f849c'
overlay0 = '#6c7086'
surface2 = '#585b70'
surface1 = '#45475a'
surface0 = '#313244'
base = '#1e1e2e'
mantle = '#181825'
crust = '#11111b'
